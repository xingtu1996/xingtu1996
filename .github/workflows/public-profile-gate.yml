name: Public profile gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  privacy-and-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard public profile files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = ["README.md", "README.en.md", "OPEN_SOURCE_MATRIX.md", "dashboard.html"]
          patterns = {
              "email address": re.compile(r"(?i)\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b"),
              "possible personal telephone number": re.compile(r"(?<!\d)1[3-9]\d{9}(?!\d)"),
              "direct contact URI": re.compile(r"(?i)\b(?:mailto|tel):"),
              "private repository URL": re.compile(r"(?i)https?://github\.com/xingtu1996/(?:xingtu-site|xingtu-vault|xingtu-accounts|xingtu-sessions|xingtu-brand-assets|xingtu-publish-packs|xingtu-material-vault)(?:[/#?]|\b)"),
          }
          errors = []
          for name in files:
              path = Path(name)
              if not path.is_file():
                  errors.append(f"missing required public file: {name}")
                  continue
              data = path.read_text(encoding="utf-8")
              for label, pattern in patterns.items():
                  if pattern.search(data):
                      errors.append(f"{name}: {label} (value not printed)")
          matrix = Path("OPEN_SOURCE_MATRIX.md")
          if matrix.exists() and "Research Preview" not in matrix.read_text(encoding="utf-8"):
              errors.append("matrix: missing research-preview boundary")
          for error in errors:
              print("FAIL:", error)
          print("NOT CHECKED: old commits, external links, media metadata, publication authorization, deployed website")
          if errors:
              raise SystemExit(1)
          print("PASS: public profile files have no flagged sensitive contact patterns")
          PY
